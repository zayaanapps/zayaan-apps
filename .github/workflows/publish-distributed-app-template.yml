# ==============================================================================
# STANDARDIZED CENTRAL APP DISTRIBUTION WORKFLOW TEMPLATE
# Copy this workflow into any individual Zayaan app repository
# (e.g., zayaanapps/zayaan-calculator, zayaanapps/zayaan-notes, zayaanapps/zayaan-ai-tools)
# to automatically build its APK, publish to GitHub Releases, and register the new
# version in the central Zayaan Apps Firestore database WITHOUT rebuilding Zayaan Apps!
# ==============================================================================
name: Publish Distributed App to Zayaan Apps Store

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      app_id:
        description: 'App ID in Zayaan Apps Firestore (e.g. zayaan-calculator)'
        required: true
        default: 'zayaan-calculator'
      app_name:
        description: 'Display Name'
        required: true
        default: 'Zayaan Calculator Pro'
      package_name:
        description: 'Android Package ID'
        required: true
        default: 'com.zayaanapps.calculator'
      category:
        description: 'Store Category'
        required: true
        default: 'Utilities'
      version_name:
        description: 'Semantic Version Name'
        required: true
        default: '1.5.0'
      version_code:
        description: 'Integer Version Code'
        required: true
        default: '15'
      release_notes:
        description: 'What is new in this version'
        required: true
        default: 'Automated GitHub Actions release synced to Zayaan Apps Store.'

permissions:
  contents: write

jobs:
  build-and-register-in-store:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout App Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build App Release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Publish APK to This Repo's GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name || github.ref_name }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true

      - name: Automatically Sync Release Metadata to Central Zayaan Apps Firestore
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIRESTORE_DATABASE_ID: ${{ secrets.FIRESTORE_DATABASE_ID }}
          FIREBASE_ADMIN_ID_TOKEN: ${{ secrets.FIREBASE_ADMIN_ID_TOKEN }}
        run: |
          APP_ID="${{ inputs.app_id || 'zayaan-calculator' }}"
          VERSION_NAME="${{ inputs.version_name || '1.5.0' }}"
          VERSION_CODE="${{ inputs.version_code || github.run_number }}"
          APK_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION_NAME}/app-release.apk"

          echo "Syncing $APP_ID ($VERSION_NAME / code $VERSION_CODE) -> $APK_URL"
          # Standardized Firestore REST PATCH call (Updates versionName, versionCode, apkDownloadUrl, releaseNotes)
          if [ -n "$FIREBASE_PROJECT_ID" ] && [ -n "$FIREBASE_ADMIN_ID_TOKEN" ]; then
            DB_ID="${FIRESTORE_DATABASE_ID:-(default)}"
            curl -s -X PATCH \
              -H "Authorization: Bearer $FIREBASE_ADMIN_ID_TOKEN" \
              -H "Content-Type: application/json" \
              "https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/${DB_ID}/documents/apps/${APP_ID}?updateMask.fieldPaths=versionName&updateMask.fieldPaths=versionCode&updateMask.fieldPaths=apkDownloadUrl&updateMask.fieldPaths=releaseNotes" \
              -d "{
                \"fields\": {
                  \"versionName\": {\"stringValue\": \"${VERSION_NAME}\"},
                  \"versionCode\": {\"integerValue\": \"${VERSION_CODE}\"},
                  \"apkDownloadUrl\": {\"stringValue\": \"${APK_URL}\"},
                  \"releaseNotes\": {\"stringValue\": \"${{ inputs.release_notes }}\"}
                }
              }"
          else
            echo "Note: Set FIREBASE_PROJECT_ID and FIREBASE_ADMIN_ID_TOKEN in GitHub Secrets for REST auto-patch, or update URL in Zayaan Apps Admin Panel."
          fi
