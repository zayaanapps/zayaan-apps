name: Zayaan Apps — Automated Android APK Release & GitHub Pages Web Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "zayaan-apps-ci-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # ============================================================================
  # JOB A: ANDROID RELEASE APK BUILD & GITHUB RELEASES PUBLISHING
  # ============================================================================
  build-android-apk:
    name: Build & Publish Android APK (com.zayaanapps.store)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_zayaan_apps

    steps:
      - name: Checkout Repository (zayaanapps/zayaan-apps)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Missing Platform Runner Files (If Needed)
        run: |
          flutter create . --project-name zayaan_apps --org com.zayaanapps --platforms=android,web

      - name: Resolve Dart/Flutter Dependencies
        run: flutter pub get

      - name: Run Static Code Analysis & Unit Tests
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build Android Release APK
        run: |
          flutter build apk --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }}

      - name: Rename Release APK for Store Distribution
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/zayaan-apps-release.apk

      - name: Check if Release Tag Already Exists (Avoid Duplicate Tag Overwrites)
        id: check_tag
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish Release APK to GitHub Releases
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_tag.outputs.tag_name }}
          name: "Zayaan Apps Store ${{ steps.check_tag.outputs.tag_name }}"
          body: |
            ### Zayaan Apps Official Store Release (${{ steps.check_tag.outputs.tag_name }})
            - **Package Name:** `com.zayaanapps.store`
            - **Version Code:** `${{ github.run_number }}`
            - **Responsive Web Portal:** https://zayaanapps.github.io/zayaan-apps/
            - **Direct APK Asset:** `zayaan-apps-release.apk`
          files: |
            flutter_zayaan_apps/build/app/outputs/flutter-apk/zayaan-apps-release.apk
            flutter_zayaan_apps/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true

  # ============================================================================
  # JOB B: FLUTTER WEB BUILD & GITHUB PAGES DEPLOYMENT
  # ============================================================================
  build-and-deploy-web:
    name: Build & Deploy Responsive Website to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: flutter_zayaan_apps

    steps:
      - name: Checkout Repository (zayaanapps/zayaan-apps)
        uses: actions/checkout@v4

      - name: Install Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Web Runner Files Exist
        run: |
          flutter create . --project-name zayaan_apps --org com.zayaanapps --platforms=web

      - name: Resolve Dependencies
        run: flutter pub get

      - name: Build Responsive Flutter Web (GitHub Pages Base Path /zayaan-apps/)
        run: |
          flutter build web --release --base-href "/zayaan-apps/"
          # Preserve direct navigation and browser refresh on GitHub Pages SPA
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: flutter_zayaan_apps/build/web

      - name: Deploy to GitHub Pages (https://zayaanapps.github.io/zayaan-apps/)
        id: deployment
        uses: actions/deploy-pages@v4
