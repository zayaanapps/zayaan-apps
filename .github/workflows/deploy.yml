name: Zayaan Apps — Automated Android APK Release & GitHub Pages Web Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "zayaan-apps-ci-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # ============================================================================
  # JOB A: NATIVE KOTLIN/JETPACK COMPOSE ANDROID APK BUILD (EXACT AI STUDIO PREVIEW)
  # ============================================================================
  build-android-apk:
    name: Build & Publish Native Android APK (com.zayaanapps.store)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (zayaanapps/zayaan-apps)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Android Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Debug Signing Keystore & Bump Version to 1.0.0.${{ github.run_number }}
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"1.0.0.${{ github.run_number }}\"/" app/build.gradle.kts

      - name: Compile Native Jetpack Compose APK (Exact AI Studio Preview)
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Package Release Assets & Compute SHA-256 Checksum
        id: apk_assets
        run: |
          mkdir -p release_assets
          APK_SOURCE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$APK_SOURCE" release_assets/zayaan-apps-release.apk
          cp "$APK_SOURCE" release_assets/zayaan-apps.apk
          cp "$APK_SOURCE" release_assets/app-release.apk
          SHA256_HASH=$(sha256sum release_assets/zayaan-apps-release.apk | awk '{print $1}')
          echo "sha256=$SHA256_HASH" >> $GITHUB_OUTPUT
          echo "Built APK SHA-256: $SHA256_HASH"

      - name: Check if Release Tag Already Exists (Avoid Duplicate Tag Overwrites)
        id: check_tag
        run: |
          TAG_NAME="v1.0.0.${{ github.run_number }}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish Native Android APK to GitHub Releases
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_tag.outputs.tag_name }}
          name: "Zayaan Apps Store ${{ steps.check_tag.outputs.tag_name }}"
          body: |
            ### Zayaan Apps Official Store Release (${{ steps.check_tag.outputs.tag_name }})
            - **Package Name:** `com.zayaanapps.store`
            - **Architecture:** Native Kotlin & Jetpack Compose (100% identical to Google AI Studio Preview)
            - **Version Name:** `1.0.0.${{ github.run_number }}`
            - **Version Code:** `${{ github.run_number }}`
            - **APK SHA-256 Checksum:** `${{ steps.apk_assets.outputs.sha256 }}`
            - **Responsive Web Portal:** https://zayaanapps.github.io/zayaan-apps/
            - **Direct APK Assets:** `zayaan-apps-release.apk`, `zayaan-apps.apk`, `app-release.apk`
          files: |
            release_assets/zayaan-apps-release.apk
            release_assets/zayaan-apps.apk
            release_assets/app-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true

  # ============================================================================
  # JOB B: FLUTTER WEB BUILD & GITHUB PAGES DEPLOYMENT
  # ============================================================================
  build-and-deploy-web:
    name: Build & Deploy Responsive Website to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: flutter_zayaan_apps

    steps:
      - name: Checkout Repository (zayaanapps/zayaan-apps)
        uses: actions/checkout@v4

      - name: Install Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Web Runner Files Exist Preserving Custom Code
        run: |
          mkdir -p assets
          cp -r lib /tmp/zayaan_lib_backup
          cp -r web /tmp/zayaan_web_backup
          cp pubspec.yaml /tmp/zayaan_pubspec_backup
          flutter create . --project-name zayaan_apps --org com.zayaanapps --platforms=web
          cp -r /tmp/zayaan_lib_backup/* lib/
          cp -r /tmp/zayaan_web_backup/* web/
          cp /tmp/zayaan_pubspec_backup pubspec.yaml

      - name: Resolve Dependencies
        run: flutter pub get

      - name: Build Responsive Flutter Web (GitHub Pages Base Path /zayaan-apps/)
        run: |
          flutter build web --release --base-href "/zayaan-apps/"
          # Preserve direct navigation and browser refresh on GitHub Pages SPA
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: flutter_zayaan_apps/build/web

      - name: Deploy to GitHub Pages (https://zayaanapps.github.io/zayaan-apps/)
        id: deployment
        uses: actions/deploy-pages@v4
