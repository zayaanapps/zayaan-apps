name: Zayaan Apps — Automated Android APK Release & GitHub Pages Web Deployment

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "zayaan-apps-ci-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # ============================================================================
  # JOB A: NATIVE KOTLIN/JETPACK COMPOSE ANDROID APK BUILD (EXACT AI STUDIO PREVIEW)
  # ============================================================================
  build-android-apk:
    name: Build & Publish Native Android APK (com.zayaanapps.store)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (zayaanapps/zayaan-apps)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Required by AGP 9.1.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle & Android Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK Licenses & Install Platform 36.1
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK_DIR"
          mkdir -p "$SDK_DIR/licenses"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          yes | sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" || yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Compute Monotonic Release Version & Restore Debug Signing Keystore
        id: version_info
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "Restored debug.keystore from DEBUG_KEYSTORE_BASE64 secret."
          elif [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64."
          elif [ -f "app/ci-debug-signing.b64" ]; then
            base64 -d app/ci-debug-signing.b64 > debug.keystore
            echo "Restored debug.keystore from app/ci-debug-signing.b64."
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore."
          fi
          keytool -list -v -keystore debug.keystore -storepass android | grep -E "SHA1:|SHA256:" || true
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi
          if [ ! -f "app/google-services.json" ] && [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [ ! -f "app/google-services.json" ] && [ -f "app/google-services.json.base64" ]; then
            base64 -d app/google-services.json.base64 > app/google-services.json
            echo "Restored app/google-services.json from app/google-services.json.base64."
          elif [ ! -f "app/google-services.json" ]; then
            echo "::warning::app/google-services.json not found."
          fi

          git fetch --tags --force >/dev/null 2>&1 || true
          MAX_TAG_NUM=$(git tag -l 'v1.0.0.*' | sed 's/^v1\.0\.0\.//' | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
          MAX_TAG_NUM=${MAX_TAG_NUM:-0}
          CANDIDATE=$((1000 + ${{ github.run_number }}))
          if [ "$MAX_TAG_NUM" -ge "$CANDIDATE" ]; then
            BUILD_CODE=$((MAX_TAG_NUM + 1))
          else
            BUILD_CODE=$CANDIDATE
          fi
          TAG_NAME="v1.0.0.${BUILD_CODE}"
          VERSION_NAME="1.0.0.${BUILD_CODE}"

          sed -i "s/versionCode = [0-9]*/versionCode = ${BUILD_CODE}/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts

          echo "Stamped app/build.gradle.kts:"
          grep -E "versionCode|versionName" app/build.gradle.kts

          echo "build_code=${BUILD_CODE}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Compile Native Jetpack Compose APK (Exact AI Studio Preview)
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Package Release Assets & Compute SHA-256 Checksum
        id: apk_assets
        run: |
          mkdir -p release_assets
          APK_SOURCE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          test -n "$APK_SOURCE" && test -f "$APK_SOURCE"
          cp "$APK_SOURCE" release_assets/zayaan-apps-release.apk
          cp "$APK_SOURCE" release_assets/zayaan-apps.apk
          cp "$APK_SOURCE" release_assets/app-release.apk
          SHA256_HASH=$(sha256sum release_assets/zayaan-apps-release.apk | awk '{print $1}')
          echo "sha256=$SHA256_HASH" >> $GITHUB_OUTPUT
          echo "Built APK ($APK_SOURCE) SHA-256: $SHA256_HASH"

      - name: Generate Latest Release Notes (Updates, Fixes & Changes)
        id: release_notes
        run: |
          TAG_NAME="${{ steps.version_info.outputs.tag_name }}"
          VERSION_NAME="${{ steps.version_info.outputs.version_name }}"
          BUILD_CODE="${{ steps.version_info.outputs.build_code }}"
          SHA256_HASH="${{ steps.apk_assets.outputs.sha256 }}"
          PREV_TAG=$(git tag -l 'v1.0.0.*' --sort=-v:refname | grep -Fxv "$TAG_NAME" | head -n 1 || true)

          : > release_notes_body.md

          if [ -f "RELEASE_NOTES.md" ]; then
            cat RELEASE_NOTES.md >> release_notes_body.md
            printf '\n' >> release_notes_body.md
          fi

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s" | grep -vE '^- (Merge |chore\(release\))' | head -n 15 || true)
          else
            COMMITS=$(git log -n 8 --no-merges --pretty=format:"- %s" | grep -vE '^- (Merge |chore\(release\))' || true)
          fi

          if [ -n "$COMMITS" ]; then
            echo "### Recent Commits ($TAG_NAME)" >> release_notes_body.md
            printf '%s\n\n' "$COMMITS" >> release_notes_body.md
          elif [ ! -f "RELEASE_NOTES.md" ]; then
            {
              echo "### Latest Updates, Fixes & Changes ($TAG_NAME)"
              echo "- Updated Zayaan Apps Store build to v${VERSION_NAME} (Build ${BUILD_CODE})."
              echo "- Includes latest stability fixes, UI refinements, and security improvements."
              echo ""
            } >> release_notes_body.md
          fi

          if [ -n "$PREV_TAG" ]; then
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG_NAME}" >> release_notes_body.md
          fi

          {
            echo ""
            echo "<details>"
            echo "<summary>Package & Build Metadata</summary>"
            echo ""
            echo "- **Package Name:** \`com.zayaanapps.store\`"
            echo "- **Version Name:** \`${VERSION_NAME}\`"
            echo "- **Version Code:** \`${BUILD_CODE}\`"
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **APK SHA-256 Checksum:** \`${SHA256_HASH}\`"
            echo "- **Responsive Web Portal:** https://zayaanapps.github.io/zayaan-apps/"
            echo "- **Direct APK Assets:** \`zayaan-apps-release.apk\`, \`zayaan-apps.apk\`, \`app-release.apk\`"
            echo "</details>"
          } >> release_notes_body.md

      - name: Publish Native Android APK to GitHub Releases (Always Mark Latest)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version_info.outputs.tag_name }}
          name: "Zayaan Apps Store ${{ steps.version_info.outputs.tag_name }}"
          make_latest: 'true'
          body_path: release_notes_body.md
          files: |
            release_assets/zayaan-apps-release.apk
            release_assets/zayaan-apps.apk
            release_assets/app-release.apk
          draft: false
          prerelease: false
          generate_release_notes: false

  # ============================================================================
  # JOB B: FLUTTER WEB BUILD & GITHUB PAGES DEPLOYMENT
  # ============================================================================
  build-and-deploy-web:
    name: Build & Deploy Responsive Website to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: flutter_zayaan_apps

    steps:
      - name: Checkout Repository (zayaanapps/zayaan-apps)
        uses: actions/checkout@v4

      - name: Install Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Web Runner Files Exist
        run: |
          mkdir -p assets
          if [ ! -f "web/index.html" ]; then
            flutter create . --project-name zayaan_apps --org com.zayaanapps --platforms=web
          fi

      - name: Resolve Dependencies
        run: flutter pub get

      - name: Build Responsive Flutter Web (GitHub Pages Base Path /zayaan-apps/)
        run: |
          flutter build web --release --base-href "/zayaan-apps/"
          # Preserve direct navigation and browser refresh on GitHub Pages SPA
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: flutter_zayaan_apps/build/web

      - name: Deploy to GitHub Pages (https://zayaanapps.github.io/zayaan-apps/)
        id: deployment
        uses: actions/deploy-pages@v4
