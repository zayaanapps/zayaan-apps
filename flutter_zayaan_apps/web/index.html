<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Zayaan Apps — Official Digital Application Store & APK Distribution Hub for Android and Web.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6FBF8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A192F">

  <!-- iOS / PWA meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zayaan Apps">
  <link rel="manifest" href="manifest.json">

  <title>Zayaan Apps</title>
  <style>
    :root {
      --bg-color: #F6FBF8;
      --fg-color: #171D1A;
      --muted-color: #52615A;
      --card-bg: #FFFFFF;
      --card-border: rgba(0, 108, 74, 0.20);
      --accent-color: #006C4A;
      --accent-fg: #FFFFFF;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0A192F;
        --fg-color: #E0E6ED;
        --muted-color: #9FB0C7;
        --card-bg: #0E1E38;
        --card-border: rgba(110, 219, 169, 0.25);
        --accent-color: #6EDBA9;
        --accent-fg: #003824;
      }
    }

    html, body {
      height: 100%;
      background-color: var(--bg-color);
      color: var(--fg-color);
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #zayaan-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-color);
      color: var(--fg-color);
      opacity: 1;
      transition: opacity 0.28s ease-out;
      pointer-events: none;
    }

    #zayaan-loader.fade-out {
      opacity: 0;
    }

    .zayaan-badge {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: linear-gradient(135deg, #006C4A, #0E1E38);
      border: 1.5px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      color: #8BF8C4;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.16);
      margin-bottom: 16px;
      animation: zayaan-pulse 1.6s ease-in-out infinite;
    }

    .zayaan-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0 0 6px 0;
    }

    .zayaan-subtitle {
      font-size: 13px;
      color: var(--muted-color);
      margin: 0 0 18px 0;
    }

    .zayaan-spinner {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2.5px solid var(--card-border);
      border-top-color: var(--accent-color);
      animation: zayaan-spin 0.8s linear infinite;
    }

    @keyframes zayaan-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes zayaan-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
</head>
<body>
  <div id="zayaan-loader" aria-label="Loading Zayaan Apps">
    <div class="zayaan-badge">Z</div>
    <p class="zayaan-title">Zayaan Apps</p>
    <p class="zayaan-subtitle">Preparing marketplace...</p>
    <div class="zayaan-spinner"></div>
  </div>
  <script>
    (function () {
      function dismissLoader() {
        var el = document.getElementById('zayaan-loader');
        if (!el || el.classList.contains('fade-out')) return;
        el.classList.add('fade-out');
        setTimeout(function () {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 320);
      }
      window.addEventListener('flutter-first-frame', dismissLoader, { once: true });
      setTimeout(dismissLoader, 6000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
